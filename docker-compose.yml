version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6-jammy
    container_name: connecthub-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: connecthub
    volumes:
      - mongo_data:/data/db

  # ConnectHub Express Backend API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: connecthub-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/connecthub
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - server_uploads:/app/uploads

  # ConnectHub Next.js Frontend Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: connecthub-client
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - server
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      INTERNAL_API_URL: http://server:5000/api

volumes:
  mongo_data:
  server_uploads:
